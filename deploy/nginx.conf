# RAJAR X YT — Nginx reverse proxy (TLS termination). Replace rajarx.example.com.
upstream rajarx_app {
    server app:8080;          # docker compose service; use 127.0.0.1:8080 on a bare VPS
    keepalive 32;
}

# Per-IP request limiting in front of the app's own limits.
limit_req_zone $binary_remote_addr zone=rx_api:10m rate=10r/s;
map $http_x_request_id $rx_request_id { default $http_x_request_id; "" "req_$request_id"; }

server {
    listen 80;
    listen [::]:80;
    server_name rajarx.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rajarx.example.com;

    ssl_certificate     /etc/letsencrypt/live/rajarx.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rajarx.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 64k;          # API bodies are tiny JSON; no uploads are accepted
    client_body_timeout 15s;
    send_timeout 120s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    location /api/ {
        limit_req zone=rx_api burst=40 nodelay;
        proxy_pass http://rajarx_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $rx_request_id;
        # Never forward these to logs: access log below omits query strings and auth headers.
        proxy_read_timeout 120s;        # analysis can take up to MEDIA_ANALYZE_TIMEOUT_MS
        proxy_buffering off;            # stream finished files without buffering to disk
    }

    location /assets/ {
        proxy_pass http://rajarx_app;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://rajarx_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $rx_request_id;
    }

    # Log path without query string; never log Authorization or Cookie headers.
    log_format rx_safe '$remote_addr - [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time rid=$rx_request_id';
    access_log /var/log/nginx/rajarx.access.log rx_safe;
}
